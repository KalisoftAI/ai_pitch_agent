steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-f"
      - "Dockerfile.sales"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$SHORT_SHA"
      - "--project=$PROJECT_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}"
      - "--set-secrets=SECRET_KEY=SALES_SECRET_KEY:latest,DATABASE_URL=SALES_DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
      - "--set-env-vars=ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_ALLOWED_DOMAINS=${_GOOGLE_ALLOWED_DOMAINS},GCS_BUCKET_CONTACTS=${_GCS_BUCKET},GCS_PATH_CONTACTS=${_GCS_PATH},CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE},CORS_ORIGINS=${_CORS_ORIGINS},ALLOWED_HOSTS=${_ALLOWED_HOSTS},RATE_LIMIT_ENABLED=true,AUTH_DEV_MODE=false,GMAIL_OAUTH_ENABLED=${_GMAIL_OAUTH_ENABLED},GOOGLE_OAUTH_REDIRECT_URI=${_GOOGLE_OAUTH_REDIRECT_URI},FRONTEND_URL=${_FRONTEND_URL}"
      - "--min-instances=0"
      - "--max-instances=${_MAX_INSTANCES}"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--concurrency=80"
      - "--timeout=300"
      - "--cpu-throttling"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - services
      - describe
      - "${_SERVICE}"
      - "--project=$PROJECT_ID"
      - "--region=${_REGION}"
      - "--format=value(status.url)"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$SHORT_SHA"

substitutions:
  _REGION: "asia-south1"
  _SERVICE: "kalisoft-sales"
  _AR_REPOSITORY: "sales-pipeline"
  _CLOUD_SQL_INSTANCE: "REPLACE_PROJECT:REPLACE_REGION:REPLACE_INSTANCE"
  _CORS_ORIGINS: "https://kalisoftai.in"
  _ALLOWED_HOSTS: "*.run.app"
  _GCS_BUCKET: "kalisoftai-datahub"
  _GCS_PATH: "all-sales-contacts-data"
  _GOOGLE_ALLOWED_DOMAINS: "kalisoftai.in"
  _GMAIL_OAUTH_ENABLED: "true"
  _GOOGLE_OAUTH_REDIRECT_URI: "https://kalisoft-sales-19782268668.asia-south1.run.app/api/email/google/callback"
  _FRONTEND_URL: "https://kalisoftai.in"
  _MAX_INSTANCES: "3"

options:
  logging: CLOUD_LOGGING_ONLY

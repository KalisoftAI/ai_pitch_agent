name: CD

on:
  push:
    branches: ["main", "UAT", "DEV"]
  workflow_dispatch:

# Direct-to-prod: push to main deploys production with no manual gate.
# Cheapest path: build in GitHub Actions (no Cloud Build charge), push once to
# Artifact Registry, then deploy to Cloud Run scaled to zero.
permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/kalisoft-sales

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      service: ${{ steps.map.outputs.service }}
      app_env: ${{ steps.map.outputs.app_env }}
      max_instances: ${{ steps.map.outputs.max_instances }}
      cors: ${{ steps.map.outputs.cors }}
    steps:
      - id: map
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "environment=production" >> "$GITHUB_OUTPUT"; echo "service=kalisoft-sales"     >> "$GITHUB_OUTPUT"; echo "app_env=production" >> "$GITHUB_OUTPUT"; echo "max_instances=3" >> "$GITHUB_OUTPUT"; echo "cors=${{ vars.CORS_ORIGINS }}"        >> "$GITHUB_OUTPUT" ;;
            UAT)  echo "environment=staging"    >> "$GITHUB_OUTPUT"; echo "service=kalisoft-sales-uat"  >> "$GITHUB_OUTPUT"; echo "app_env=staging"    >> "$GITHUB_OUTPUT"; echo "max_instances=2" >> "$GITHUB_OUTPUT"; echo "cors=${{ vars.CORS_ORIGINS_UAT }}"    >> "$GITHUB_OUTPUT" ;;
            *)    echo "environment=development" >> "$GITHUB_OUTPUT"; echo "service=kalisoft-sales-dev"  >> "$GITHUB_OUTPUT"; echo "app_env=development" >> "$GITHUB_OUTPUT"; echo "max_instances=1" >> "$GITHUB_OUTPUT"; echo "cors=${{ vars.CORS_ORIGINS_DEV }}"    >> "$GITHUB_OUTPUT" ;;
          esac

  deploy:
    name: Build & deploy (${{ needs.resolve.outputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -f Dockerfile.sales -t "${IMAGE_BASE}:${GITHUB_SHA}" -t "${IMAGE_BASE}:latest" .

      - name: Push image
        run: docker push "${IMAGE_BASE}:${GITHUB_SHA}"

      - name: Clear conflicting secret/env refs
        run: |
          gcloud run services update "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --remove-env-vars "GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_ALLOWED_DOMAINS,GOOGLE_ALLOWED_EMAILS,ALLOWED_HOSTS,CORS_ORIGINS" \
            --remove-secrets "GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET" || true

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ needs.resolve.outputs.service }}" \
            --image "${IMAGE_BASE}:${GITHUB_SHA}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets "SECRET_KEY=SALES_SECRET_KEY:latest,DATABASE_URL=SALES_DATABASE_URL:latest" \
            --set-env-vars "ENV=${{ needs.resolve.outputs.app_env }},GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI || 'https://kalisoft-sales-19782268668.asia-south1.run.app' }},GCS_BUCKET_CONTACTS=${{ vars.GCS_BUCKET }},GCS_PATH_CONTACTS=${{ vars.GCS_PATH }},CLOUD_SQL_CONNECTION_NAME=${{ vars.CLOUD_SQL_INSTANCE }},RATE_LIMIT_ENABLED=true,AUTH_DEV_MODE=false,GMAIL_OAUTH_ENABLED=${{ vars.GMAIL_OAUTH_ENABLED || 'true' }},GOOGLE_OAUTH_REDIRECT_URI=${{ vars.GOOGLE_OAUTH_REDIRECT_URI || 'https://kalisoft-sales-19782268668.asia-south1.run.app//api/email/google/callback' }},FRONTEND_URL=${{ vars.FRONTEND_URL || 'https://kalisoft-sales-19782268668.asia-south1.run.app' }},GEMMA_MODEL=${{ vars.GEMMA_MODEL || 'gemma-4-27b-it' }},LLM_GEMMA_MODEL=${{ vars.LLM_GEMMA_MODEL || 'gemma-4-27b-it' }}" \
            --min-instances=0 \
            --max-instances="${{ needs.resolve.outputs.max_instances }}" \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --timeout=300 \
            --cpu-throttling

      - name: Set comma-containing env vars
        run: |
          gcloud run services update "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "GOOGLE_ALLOWED_DOMAINS=${{ vars.GOOGLE_ALLOWED_DOMAINS }}"
          gcloud run services update "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "GOOGLE_ALLOWED_EMAILS=${{ vars.GOOGLE_ALLOWED_EMAILS || 'ai.solutions@kalisoftai.in,kalikaenterprises@gmail.com' }}"
          gcloud run services update "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}"
          gcloud run services update "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "CORS_ORIGINS=${{ needs.resolve.outputs.cors }}"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
          curl -fsS "$URL/api/health" || (echo "Health check failed" && exit 1)

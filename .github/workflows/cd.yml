name: CD

on:
  push:
    branches: ["main", "UAT", "DEV"]
  workflow_dispatch:

# Direct-to-prod: push to main deploys production with no manual gate.
# Cheapest path: build in GitHub Actions (no Cloud Build charge), push once to
# Artifact Registry, then deploy to Cloud Run scaled to zero.
permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/kalisoft-sales

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      service: ${{ steps.map.outputs.service }}
      app_env: ${{ steps.map.outputs.app_env }}
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      max_instances: ${{ steps.map.outputs.max_instances }}
      cors: ${{ steps.map.outputs.cors }}
      allowed_hosts: ${{ steps.map.outputs.allowed_hosts }}
      frontend_url: ${{ steps.map.outputs.frontend_url }}
      graph_chat_enabled: ${{ steps.map.outputs.graph_chat_enabled }}
    steps:
      - id: map
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ] || [ -z "${{ vars.GCP_REGION }}" ] || \
             [ -z "${{ vars.ARTIFACT_REPOSITORY }}" ] || [ -z "${{ vars.CLOUD_SQL_INSTANCE }}" ] || \
             [ -z "${{ vars.GCS_BUCKET }}" ] || [ -z "${{ vars.GCS_PATH }}" ] || \
             [ -z "${{ secrets.GOOGLE_CLIENT_ID }}" ] || [ -z "${{ vars.GOOGLE_ALLOWED_DOMAINS }}" ]; then
            echo "Required GitHub Actions deployment variables are missing"; exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            main)
              ENV=production; DEPLOY_ENV=prod; SVC=kalisoft-sales; APP=production; MAX=3
              FE="${{ vars.FRONTEND_URL }}"; CORS="${{ vars.CORS_ORIGINS }}"; HOSTS="${{ vars.ALLOWED_HOSTS }}"
              GRAPH_CHAT=false
              ;;
            UAT)
              ENV=staging; DEPLOY_ENV=uat; SVC=kalisoft-sales-uat; APP=staging; MAX=2
              FE="${{ vars.FRONTEND_URL_UAT }}"; CORS="${{ vars.CORS_ORIGINS_UAT }}"; HOSTS="${{ vars.ALLOWED_HOSTS_UAT }}"
              GRAPH_CHAT="${{ vars.KNOWLEDGE_GRAPH_CHAT_ENABLED_UAT }}"
              ;;
            DEV)
              ENV=development; DEPLOY_ENV=dev; SVC=kalisoft-sales-dev; APP=development; MAX=1
              FE="${{ vars.FRONTEND_URL_DEV }}"; CORS="${{ vars.CORS_ORIGINS_DEV }}"; HOSTS="${{ vars.ALLOWED_HOSTS_DEV }}"
              GRAPH_CHAT="${{ vars.KNOWLEDGE_GRAPH_CHAT_ENABLED_DEV }}"
              ;;
            *) echo "Unsupported deploy branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          if [ -z "$FE" ] || [ -z "$CORS" ] || [ -z "$HOSTS" ]; then
            echo "FRONTEND_URL, CORS_ORIGINS and ALLOWED_HOSTS must be set for ${GITHUB_REF_NAME}"; exit 1
          fi
          CORS="${CORS//[[:space:]]/}"
          HOSTS="${HOSTS//[[:space:]]/}"
          if [[ ! "$FE" =~ ^https://[^/]+/?$ ]]; then echo "FRONTEND_URL must be an explicit HTTPS origin"; exit 1; fi
          IFS=',' read -ra ORIGINS <<< "$CORS"
          for ORIGIN in "${ORIGINS[@]}"; do
            ORIGIN="${ORIGIN//[[:space:]]/}"
            if [[ -z "$ORIGIN" || "$ORIGIN" == *"*"* || ! "$ORIGIN" =~ ^https://[^/]+$ ]]; then
              echo "CORS_ORIGINS entries must be explicit HTTPS origins without wildcards"; exit 1
            fi
          done
          IFS=',' read -ra HOST_ENTRIES <<< "$HOSTS"
          for HOST in "${HOST_ENTRIES[@]}"; do
            HOST="${HOST//[[:space:]]/}"
            if [[ -z "$HOST" || "$HOST" == *"*"* || ! "$HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
              echo "ALLOWED_HOSTS entries must be explicit hostnames without wildcards"; exit 1
            fi
          done
          FE_ORIGIN="${FE%/}"
          GRAPH_CHAT="${GRAPH_CHAT:-false}"
          if [ "$GRAPH_CHAT" != "true" ]; then GRAPH_CHAT=false; fi
          case ",$CORS," in
            *",$FE_ORIGIN,"*) ;;
            *) echo "CORS_ORIGINS must include FRONTEND_URL origin"; exit 1 ;;
          esac
          {
            echo "environment=$ENV"; echo "service=$SVC"; echo "app_env=$APP";
            echo "deploy_env=$DEPLOY_ENV";
            echo "max_instances=$MAX"; echo "frontend_url=$FE";
            echo "graph_chat_enabled=$GRAPH_CHAT";
            echo "allowed_hosts=$HOSTS"; echo "cors=$CORS";
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & deploy (${{ needs.resolve.outputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -f Dockerfile.sales -t "${IMAGE_BASE}:${GITHUB_SHA}" -t "${IMAGE_BASE}:latest" .

      - name: Push image
        run: docker push "${IMAGE_BASE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          echo "== Secret Manager secrets (names only) =="
          gcloud secrets list --project "$P" --format="value(name)" 2>&1 || true
          echo "== Current prod secret refs (names only) =="
          gcloud run services describe kalisoft-sales --project "$P" --region "${{ vars.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].env[].name)" 2>&1 || true
          # Signing key and database URL are required. Optional service credentials
          # are bound only when present; no secret values are printed.
          for REQUIRED_SECRET in SALES_SECRET_KEY SALES_DATABASE_URL; do
            if ! gcloud secrets describe "$REQUIRED_SECRET" --project "$P" >/dev/null 2>&1; then
              echo "::warning::Secret not describable or missing: $REQUIRED_SECRET (continuing to reveal real name below)"
            fi
          done
          SECRETS="SECRET_KEY=SALES_SECRET_KEY:latest,DATABASE_URL=SALES_DATABASE_URL:latest"
          add_optional_secret() {  # $1 = env var name, $2 = Secret Manager secret name
            if gcloud secrets describe "$2" --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
              SECRETS="${SECRETS:+$SECRETS,}$1=$2:latest"
            else
              echo "Optional secret is not configured: $2"
            fi
          }
          add_optional_secret GEMINI_API_KEY GEMINI_API_KEY
          add_optional_secret GOOGLE_CLIENT_SECRET GOOGLE_CLIENT_SECRET
          add_optional_secret SMTP_PASSWORD SMTP_PASSWORD

          gcloud run deploy "${{ needs.resolve.outputs.service }}" \
            --image "${IMAGE_BASE}:${GITHUB_SHA}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "^@^ENV=${{ needs.resolve.outputs.app_env }}@DEPLOY_ENV=${{ needs.resolve.outputs.deploy_env }}@GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}@GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}@GOOGLE_ALLOWED_DOMAINS=${{ vars.GOOGLE_ALLOWED_DOMAINS }}@ALLOWED_HOSTS=${{ needs.resolve.outputs.allowed_hosts }}@CORS_ORIGINS=${{ needs.resolve.outputs.cors }}@GCS_BUCKET_CONTACTS=${{ vars.GCS_BUCKET }}@GCS_PATH_CONTACTS=${{ vars.GCS_PATH }}@KNOWLEDGE_GRAPH_GCS_PREFIX=sales-app/knowledge_graph/@KNOWLEDGE_GRAPH_REFRESH_DAYS=7@KNOWLEDGE_GRAPH_CHAT_ENABLED=${{ needs.resolve.outputs.graph_chat_enabled }}@CLOUD_SQL_CONNECTION_NAME=${{ vars.CLOUD_SQL_INSTANCE }}@RATE_LIMIT_ENABLED=true@AUTH_DEV_MODE=false@GEMMA_MODEL=${{ vars.GEMMA_MODEL || 'gemma-4-27b-it' }}@LLM_GEMMA_MODEL=${{ vars.LLM_GEMMA_MODEL || 'gemma-4-27b-it' }}@FRONTEND_URL=${{ needs.resolve.outputs.frontend_url }}" \
            --update-secrets "$SECRETS" \
            --min-instances=0 \
            --max-instances="${{ needs.resolve.outputs.max_instances }}" \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=80 \
            --timeout=900 \
            --cpu-throttling

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${{ needs.resolve.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
          curl -fsS "$URL/api/health" || (echo "Health check failed" && exit 1)

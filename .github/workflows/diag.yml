name: Diag

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Secrets and services
        run: |
          set +e
          P="${{ vars.GCP_PROJECT_ID }}"; R="${{ vars.GCP_REGION }}"
          echo "== secrets list =="
          gcloud secrets list --project "$P" --format="value(name)" 2>&1
          echo "== prod env refs =="
          gcloud run services describe kalisoft-sales --project "$P" --region "$R" --format="yaml(spec.template.spec.containers[0].env)" 2>&1
          echo "== uat service =="
          gcloud run services describe kalisoft-sales-uat --project "$P" --region "$R" --format="value(status.url)" 2>&1
          echo "== describe SALES_SECRET_KEY =="
          gcloud secrets describe SALES_SECRET_KEY --project "$P" 2>&1 | head -6
          echo "== access SALES_SECRET_KEY =="
          gcloud secrets versions access latest --secret SALES_SECRET_KEY --project "$P" >/dev/null 2>&1 && echo ACCESS_OK || echo ACCESS_FAIL
          echo "== access SALES_DATABASE_URL =="
          gcloud secrets versions access latest --secret SALES_DATABASE_URL --project "$P" >/dev/null 2>&1 && echo ACCESS_OK || echo ACCESS_FAIL

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", ".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"migrations/*" = ["E402"]

[tool.coverage.run]
source = ["sales_fastapi"]
omit = ["sales_fastapi/static/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
